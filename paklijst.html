<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#3f4a2e" />
<title>Paklijst — vakantie &amp; reservisten-klus</title>
<style>
  :root{
    --olive:#3f4a2e; --olive-donker:#2e3721; --olive-soft:#eef1e4;
    --gold:#c9a227; --bg:#f4f5ef; --card:#ffffff; --line:#e0e2d5;
    --ink:#232820; --muted:#6b7261; --green:#15803d; --green-soft:#e7f6ec;
    --rood:#b20000; --rood-soft:#fdecec;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
    color:var(--ink); background:var(--bg);
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
    overscroll-behavior:none;
  }
  .top{
    background:linear-gradient(135deg,var(--olive-donker) 0%,var(--olive) 100%);
    color:#fff; padding:14px 16px calc(12px + env(safe-area-inset-top));
    padding-top:calc(14px + env(safe-area-inset-top));
    position:sticky; top:0; z-index:10; box-shadow:0 2px 10px rgba(0,0,0,.18);
  }
  .top h1{font-size:18px; font-weight:800; letter-spacing:.02em;}
  .top .sub{font-size:12px; opacity:.85; margin-top:2px;}
  .prog-row{display:flex; align-items:center; gap:10px; margin-top:10px;}
  .prog-track{flex:1; height:8px; background:rgba(255,255,255,.25); border-radius:999px; overflow:hidden;}
  .prog-fill{height:100%; width:0%; background:var(--gold); border-radius:999px; transition:width .25s ease;}
  .prog-txt{font-size:12px; font-weight:700; white-space:nowrap;}
  .klaar{font-size:13px; font-weight:800; color:var(--gold); margin-top:8px; display:none;}
  main{max-width:560px; margin:0 auto; padding:14px 14px 0;}
  .sectie{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    margin-bottom:12px; overflow:hidden; box-shadow:0 1px 4px rgba(35,40,32,.06);
  }
  .sectie-kop{
    width:100%; display:flex; align-items:center; gap:10px; text-align:left;
    background:var(--olive-soft); border:none; cursor:pointer;
    padding:13px 14px; font-family:inherit; min-height:52px;
  }
  .sectie-kop .chevron{
    font-size:13px; color:var(--olive); transition:transform .2s ease; flex:none;
  }
  .sectie.open .sectie-kop .chevron{transform:rotate(90deg);}
  .sectie-kop .titel{flex:1; font-size:15px; font-weight:800; color:var(--olive-donker);}
  .sectie-kop .telling{
    font-size:12px; font-weight:700; color:var(--muted);
    background:#fff; border:1px solid var(--line); border-radius:999px; padding:3px 10px; white-space:nowrap;
  }
  .sectie.voltooid .sectie-kop .telling{background:var(--green-soft); border-color:#bfe6cc; color:var(--green);}
  .sectie-lijst{display:none; padding:6px 8px 10px;}
  .sectie.open .sectie-lijst{display:block;}
  .item{
    display:flex; align-items:center; gap:12px; min-height:48px;
    padding:8px 8px; border-radius:10px; cursor:pointer; font-size:15px;
    border-bottom:1px solid var(--line);
  }
  .item:last-child{border-bottom:none;}
  .item:active{background:var(--bg);}
  .item input{position:absolute; opacity:0; width:0; height:0;}
  .item .box{
    flex:none; width:26px; height:26px; border-radius:8px;
    border:2px solid var(--olive); background:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:17px; font-weight:900; color:#fff; transition:all .15s ease;
  }
  .item .box .vink{opacity:0; transform:scale(.4); transition:all .15s ease; line-height:1;}
  .item input:checked + .box{background:var(--green); border-color:var(--green);}
  .item input:checked + .box .vink{opacity:1; transform:scale(1);}
  .item input:focus-visible + .box{outline:3px solid var(--gold); outline-offset:2px;}
  .item .tekst{flex:1; line-height:1.35;}
  .item input:checked ~ .tekst{color:var(--muted); text-decoration:line-through;}
  .knoppen{display:flex; gap:10px; margin:16px 0 8px;}
  .knop{
    flex:1; padding:12px; border-radius:10px; border:1.5px solid var(--olive);
    background:#fff; color:var(--olive-donker); font-family:inherit;
    font-size:14px; font-weight:700; cursor:pointer; min-height:48px;
  }
  .knop:active{background:var(--olive-soft);}
  .reset{
    width:100%; margin:4px 0 10px; padding:14px; border-radius:10px; border:none;
    background:var(--rood); color:#fff; font-family:inherit; font-size:15px;
    font-weight:800; cursor:pointer; min-height:52px; transition:background .15s ease;
  }
  .reset.bevestig{background:var(--rood); animation:puls .8s ease infinite alternate;}
  @keyframes puls{from{filter:brightness(1);}to{filter:brightness(1.18);}}
  .hint{font-size:12px; color:var(--muted); text-align:center; margin:2px 0 14px; line-height:1.5;}
  footer{
    text-align:center; font-size:11px; color:var(--muted);
    padding:10px 16px calc(16px + env(safe-area-inset-bottom));
  }
</style>
</head>
<body>
<header class="top">
  <h1>Paklijst</h1>
  <div class="sub">Vakantie of reservisten-klus — vink af wat je hebt ingepakt</div>
  <div class="prog-row">
    <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
    <div class="prog-txt" id="progTxt">0/0</div>
  </div>
  <div class="klaar" id="klaar">Alles ingepakt — fijne reis! 🎒</div>
</header>
<main id="lijst"></main>
<div style="max-width:560px;margin:0 auto;padding:0 14px;">
  <div class="knoppen">
    <button class="knop" id="allesOpen" type="button">Alles uitklappen</button>
    <button class="knop" id="allesDicht" type="button">Alles inklappen</button>
  </div>
  <button class="reset" id="resetBtn" type="button">🗑 Alles resetten</button>
  <p class="hint" id="resetHint">Je afvinkjes blijven bewaard op dit toestel, ook als je de pagina sluit.<br>Reset wist alle vinkjes (met bevestiging).</p>
</div>
<footer>Paklijst · bewaard in je browser (localStorage)</footer>

<script>
(function(){
  "use strict";
  var SLEUTEL = "paklijst.state.v3";
  var SLEUTEL_V2 = "paklijst.state.v2";
  var SLEUTEL_OUD = "paklijst.state.v1";

  var SECTIES = [
    { id:"gewone-kleding", titel:"Gewone kleding", items:[
      "Ondergoed (genoeg voor alle dagen + 1 extra)",
      "Sokken",
      "Hemden",
      "Broeken, korte broeken",
      "Overhemden",
      "Polo's",
      "Riem(en)",
      "Trui of vest",
      "(Regen)jas",
      "Zwemkleding",
      "Comfortabele schoenen (sneakers)",
      "Wandelschoenen"
    ]},
    { id:"militaire-kleding", titel:"Militaire kleding", items:[
      "Twee keer BT",
      "Colletje",
      "Regenpak",
      "Baret",
      "Handschoenen",
      "DT: Pak, wit overhemd, stropdas",
      "DT Schoenen",
      "Kisten",
      "Elastiekjes voor broekspijpen"
    ]},
    { id:"toiletartikelen", titel:"Toiletartikelen", items:[
      "Tandenborstel en tandpasta",
      "Deodorant",
      "Scheerapparaat",
      "Douchegel",
      "Zonnebrandcrème",
      "Oordopjes"
    ]},
    { id:"militaire-accessoires", titel:"Militaire accessoires", items:[
      "Rugzak of reistas",
      "Veldfles of waterzak",
      "Horloge",
      "Zaklamp of koplamp",
      "Mes of multitool",
      "Notitieboekje en pen",
      "Handdoeken",
      "Waszak",
      "Defensiepas",
      "Oproep- / reservistenpapieren"
    ]},
    { id:"reisbescheiden", titel:"Reisbescheiden", items:[
      "ID-kaart of paspoort",
      "Rijbewijs",
      "Zorgverzekeringspas",
      "Portemonnee",
      "Tickets en reserveringsbewijzen"
    ]},
    { id:"extras", titel:"Extra's", items:[
      "Telefoonoplader en kabel",
      "Reisstekkeradapter (voor het buitenland)",
      "Snacks voor onderweg",
      "Waterfles",
      "Boek of e-reader",
      "Hoofdtelefoon",
      "EHBO-setje",
      "Zonnebril",
      "Powerbank",
      "Laptop of tablet + oplader"
    ]}
  ];

  var OUDE_LIJSTEN = {
    "gewone-kleding":[
      "Ondergoed (genoeg voor alle dagen + 1 extra)",
      "Sokken",
      "T-shirts en tops",
      "Broeken en shorts",
      "Trui of vest",
      "(Regen)jas",
      "Zwemkleding",
      "Pyjama",
      "Comfortabele schoenen (sneakers)",
      "Wandelschoenen"
    ],
    "militaire-kleding":[
      "Compleet OEF-tenue",
      "Werk-/daily-wear tenue",
      "Fleece of warme trui",
      "Regenpak",
      "Pet, baret of hoed",
      "Handschoenen",
      "Buff of sjaal"
    ],
    "toiletartikelen":[
      "Tandenborstel en tandpasta",
      "Deodorant",
      "Scheerapparaat of mesje",
      "Shampoo en douchegel",
      "Zonnebrandcrème",
      "Kam of borstel",
      "Persoonlijke medicijnen",
      "Pijnstillers en pleisters"
    ],
    "militaire-accessoires":[
      "Rugzak of reistas",
      "Veldfles",
      "Horloge",
      "Zonnebril",
      "Zaklamp of koplamp",
      "Mes of multitool",
      "Paracord",
      "Notitieboekje en pen",
      "Powerbank",
      "Oordopjes"
    ],
    "reisbescheiden":[
      "ID-kaart of paspoort",
      "Rijbewijs",
      "Zorgverzekeringspas",
      "Bankpas (en pincode onthouden)",
      "Contant geld",
      "Tickets en reserveringsbewijzen",
      "Oproep- / reservistenpapieren",
      "Kopieën van documenten (digitaal of papieren)"
    ],
    "extras":[
      "Telefoonoplader en kabel",
      "Reisstekkeradapter (voor het buitenland)",
      "Snacks voor onderweg",
      "Waterfles",
      "Boek of e-reader",
      "Hoofdtelefoon",
      "Kussen of slaapzak (bij meerdaagse klus)",
      "EHBO-setje"
    ]
  };

  function itemId(label){ return label; }

  function migreer(){
    var v2 = null, v1 = null;
    try{ v2 = JSON.parse(localStorage.getItem(SLEUTEL_V2)); }catch(e){}
    try{ v1 = JSON.parse(localStorage.getItem(SLEUTEL_OUD)); }catch(e){}
    var open = {}, checked = {};
    if(v2 && typeof v2 === "object"){
      if(v2.open && typeof v2.open === "object") open = v2.open;
      Object.keys(v2.checked || {}).forEach(function(k){
        var i = k.indexOf("#");
        checked[i !== -1 ? k.slice(i + 1) : k] = true;
      });
    }else if(v1 && typeof v1 === "object"){
      if(v1.open && typeof v1.open === "object") open = v1.open;
      Object.keys(v1.checked || {}).forEach(function(oldId){
        var k = oldId.lastIndexOf("-");
        if(k < 0) return;
        var labels = OUDE_LIJSTEN[oldId.slice(0, k)];
        var i = parseInt(oldId.slice(k + 1), 10);
        if(labels && !isNaN(i) && labels[i] != null) checked[labels[i]] = true;
      });
    }else{
      return null;
    }
    var state = { checked:checked, open:open };
    schrijfState(state);
    try{ localStorage.removeItem(SLEUTEL_V2); localStorage.removeItem(SLEUTEL_OUD); }catch(e){}
    return state;
  }

  function leesState(){
    try{
      var s = JSON.parse(localStorage.getItem(SLEUTEL));
      if(s && typeof s === "object") return s;
    }catch(e){}
    var gemigreerd = migreer();
    if(gemigreerd) return gemigreerd;
    return { checked:{}, open:{} };
  }
  function schrijfState(state){
    try{ localStorage.setItem(SLEUTEL, JSON.stringify(state)); }catch(e){}
  }

  var state = leesState();
  var lijst = document.getElementById("lijst");
  var progFill = document.getElementById("progFill");
  var progTxt = document.getElementById("progTxt");
  var klaar = document.getElementById("klaar");

  var total = 0;
  SECTIES.forEach(function(s){ total += s.items.length; });

  function render(){
    lijst.innerHTML = "";
    SECTIES.forEach(function(s){
      var open = state.open.hasOwnProperty(s.id) ? state.open[s.id] : true;
      var sectie = document.createElement("section");
      sectie.className = "sectie" + (open ? " open" : "");
      sectie.dataset.id = s.id;

      var kop = document.createElement("button");
      kop.type = "button";
      kop.className = "sectie-kop";
      kop.setAttribute("aria-expanded", open ? "true" : "false");
      kop.innerHTML =
        '<span class="chevron">▶</span>' +
        '<span class="titel"></span>' +
        '<span class="telling"></span>';
      kop.querySelector(".titel").textContent = s.titel;

      kop.addEventListener("click", function(){
        state.open[s.id] = !open;
        schrijfState(state);
        sectie.classList.toggle("open", state.open[s.id]);
        kop.setAttribute("aria-expanded", state.open[s.id] ? "true" : "false");
      });

      var ul = document.createElement("div");
      ul.className = "sectie-lijst";
      s.items.forEach(function(label, i){
        var id = itemId(label);
        var row = document.createElement("label");
        row.className = "item";
        var cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = !!state.checked[id];
        cb.addEventListener("change", function(){
          if(cb.checked){ state.checked[id] = true; } else { delete state.checked[id]; }
          schrijfState(state);
          update();
        });
        var box = document.createElement("span");
        box.className = "box";
        box.innerHTML = '<span class="vink">✓</span>';
        var tekst = document.createElement("span");
        tekst.className = "tekst";
        tekst.textContent = label;
        row.appendChild(cb); row.appendChild(box); row.appendChild(tekst);
        ul.appendChild(row);
      });

      sectie.appendChild(kop);
      sectie.appendChild(ul);
      lijst.appendChild(sectie);
    });
    update();
  }

  function update(){
    var checked = 0;
    var tellingen = {};
    SECTIES.forEach(function(s){
      var c = 0;
      s.items.forEach(function(label){ if(state.checked[itemId(label)]) c++; });
      tellingen[s.id] = c;
      checked += c;
    });
    progFill.style.width = (total ? (checked/total*100) : 0) + "%";
    progTxt.textContent = checked + "/" + total;
    klaar.style.display = (checked === total && total > 0) ? "block" : "none";
    Array.prototype.forEach.call(lijst.children, function(sectie){
      var id = sectie.dataset.id;
      var telling = sectie.querySelector(".telling");
      telling.textContent = tellingen[id] + "/" + SECTIES.filter(function(s){return s.id===id;})[0].items.length;
      sectie.classList.toggle("voltooid", tellingen[id] === SECTIES.filter(function(s){return s.id===id;})[0].items.length);
    });
  }

  document.getElementById("allesOpen").addEventListener("click", function(){
    SECTIES.forEach(function(s){ state.open[s.id] = true; });
    schrijfState(state);
    render();
  });
  document.getElementById("allesDicht").addEventListener("click", function(){
    SECTIES.forEach(function(s){ state.open[s.id] = false; });
    schrijfState(state);
    render();
  });

  var resetBtn = document.getElementById("resetBtn");
  var resetHint = document.getElementById("resetHint");
  var bevestigTimer = null;
  resetBtn.addEventListener("click", function(){
    if(!resetBtn.classList.contains("bevestig")){
      resetBtn.classList.add("bevestig");
      resetBtn.textContent = "⚠ Weet je het zeker? Klik nogmaals om alles te wissen";
      resetHint.textContent = "Dit wist ALLE vinkjes onomkeerbaar. Klik nogmaals op de knop om te bevestigen.";
      bevestigTimer = setTimeout(function(){
        resetBtn.classList.remove("bevestig");
        resetBtn.textContent = "🗑 Alles resetten";
        resetHint.innerHTML = "Je afvinkjes blijven bewaard op dit toestel, ook als je de pagina sluit.<br>Reset wist alle vinkjes (met bevestiging).";
      }, 5000);
      return;
    }
    clearTimeout(bevestigTimer);
    state = { checked:{}, open:state.open };
    schrijfState(state);
    resetBtn.classList.remove("bevestig");
    resetBtn.textContent = "🗑 Alles resetten";
    resetHint.innerHTML = "Je afvinkjes blijven bewaard op dit toestel, ook als je de pagina sluit.<br>Reset wist alle vinkjes (met bevestiging).";
    render();
  });

  render();
})();
</script>
</body>
</html>
